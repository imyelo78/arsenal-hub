name = "arsenal-hub"
compatibility_date = "2026-09-21"

# Cloudflare Pages 项目配置（Pages 配置不允许 main 字段）
pages_build_output_dir = "dist"

# D1 数据库绑定
# 变量名必须是 DB（server/utils/db.ts 里用的是 event.context.cloudflare.env.DB）
# 创建后把 database_id 替换成 wrangler d1 create 返回的真实 UUID
[[d1_databases]]
binding = "DB"
database_name = "arsenal-hub-db"
database_id = "99189de0-a8e9-4731-9c5c-f05b727f11eb"
